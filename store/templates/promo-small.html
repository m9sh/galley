<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Galley — Understand changes. Review in peace.</title>
    <style>
      html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
      body { position: relative; box-sizing: border-box; padding: 24px 28px; background: #f6f5ef; color: #243e32; font-family: var(--sans); font-optical-sizing: auto; font-kerning: normal; -webkit-font-smoothing: antialiased; }
      .brand { display: flex; align-items: center; gap: 9px; }
      .brand svg { width: 28px; height: 28px; }
      .word { font: 600 26px/1 var(--serif); letter-spacing: -1px; }
      .platforms { margin-left: auto; color: #67756a; font-size: 9px; letter-spacing: .8px; text-transform: uppercase; }
      h1 { margin: 22px 0 0; font: 400 44px/1.05 var(--serif); letter-spacing: -1.2px; }
      h1 em { color: #5b7b3f; font-style: italic; }
      .change { position: absolute; left: 28px; bottom: 24px; margin: 0; font: 15px/1.4 var(--serif); }
      ins { padding: 1px 2px; background: #e1ebd0; text-decoration: none; }
      del { color: #895d50; background: #f5e9df; text-decoration-color: #ac796d; text-decoration-thickness: 1.5px; }
      del + ins { margin-inline-start: .18em; }
      .mark { position: absolute; left: 18px; bottom: 26px; height: 17px; width: 2px; background: #9caf91; border-radius: 2px; }
    </style>
  </head>
  <body>
    <div class="brand">{{ICON}}<span class="word">galley</span><span class="platforms">GitHub + GitLab</span></div>
    <h1>Understand changes.<br /><em>Review in peace.</em></h1>
    <span class="mark" aria-hidden="true"></span>
    <p class="change">See edits <del>on their own</del><ins>in context</ins>.</p>
  </body>
</html>
