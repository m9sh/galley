<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Galley — Make room for better reviews</title>
    <style>
      html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
      body { box-sizing: border-box; padding: 25px 30px; background: #f6f5ef; color: #243e32; font-family: var(--sans); }
      body { font-optical-sizing: auto; font-kerning: normal; -webkit-font-smoothing: antialiased; }
      .brand { display: flex; align-items: center; gap: 9px; }
      .brand svg { width: 28px; height: 28px; }
      .word { font: 600 27px/1 var(--serif); letter-spacing: -1px; }
      .platforms { margin-left: auto; color: #67756a; font-size: 9px; letter-spacing: .8px; text-transform: uppercase; }
      h1 { margin: 27px 0 13px; font: 400 40px/1.04 var(--serif); letter-spacing: -1.6px; }
      .description { margin: 0; color: #55645a; font-size: 14px; line-height: 1.5; }
      .promise { position: absolute; bottom: 25px; margin: 0; color: #657469; font-size: 12px; letter-spacing: .12px; }
      .mark { position: absolute; top: 91px; right: 28px; height: 65px; width: 2px; background: #a6b996; border-radius: 2px; }
    </style>
  </head>
  <body>
    <div class="brand">{{ICON}}<span class="word">galley</span><span class="platforms">GitHub + GitLab</span></div>
    <h1>Make room for<br />better reviews.</h1>
    <p class="description">Read changes. Understand ideas.<br />Keep the conversation close.</p>
    <p class="promise">Open source · Local rendering · No tracking</p>
    <span class="mark" aria-hidden="true"></span>
  </body>
</html>
