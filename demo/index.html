<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galley demo</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #59636e;
        --rule: #d8dee4;
        --soft: #f6f8fa;
        --add: #e6ffec;
        --add-num: #ccffd8;
        --del: #ffebe9;
        --del-num: #ffd7d5;
        --hunk: #eef4fb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 52px;
        padding: 0 24px;
        border-bottom: 1px solid var(--rule);
        background: var(--soft);
      }
      .logo {
        font-weight: 700;
      }
      .crumbs {
        color: var(--muted);
      }
      main {
        padding: 22px 24px 40px;
      }
      h1 {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 6px;
        font-size: 24px;
        font-weight: 600;
      }
      .state {
        padding: 2px 10px;
        border-radius: 999px;
        background: #1f883d;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
      }
      .meta {
        margin: 0 0 18px;
        color: var(--muted);
      }
      .tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--rule);
      }
      .tabs span {
        padding: 8px 14px;
        border-bottom: 2px solid transparent;
        color: var(--muted);
      }
      .tabs span.on {
        border-bottom-color: #fd8c73;
        color: var(--fg);
        font-weight: 600;
      }
      .tabs b {
        margin-left: 4px;
        padding: 0 7px;
        border-radius: 999px;
        background: var(--soft);
        font-weight: 500;
      }
      .layout {
        display: grid;
        grid-template-columns: 270px minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      .files {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 13px;
      }
      .files li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 6px;
      }
      .files li.on {
        background: var(--soft);
        font-weight: 600;
      }
      .files .stat {
        flex: none;
        font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .files .stat .a {
        color: #1a7f37;
      }
      .files .stat .d {
        color: #cf222e;
      }
      .diff {
        overflow: hidden;
        border: 1px solid var(--rule);
        border-radius: 8px;
      }
      .file-head {
        padding: 9px 14px;
        border-bottom: 1px solid var(--rule);
        background: var(--soft);
        font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font: 12.5px/20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      col.num {
        width: 46px;
      }
      td {
        padding: 0 10px;
        white-space: pre-wrap;
        word-break: break-word;
        vertical-align: top;
      }
      td.n {
        color: var(--muted);
        text-align: right;
        user-select: none;
      }
      tr.add td {
        background: var(--add);
      }
      tr.add td.n {
        background: var(--add-num);
      }
      tr.del td {
        background: var(--del);
      }
      tr.del td.n {
        background: var(--del-num);
      }
      tr.hunk td {
        background: var(--hunk);
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header class="top"><span class="logo">acme</span><span class="crumbs">handbook / Merge requests / !128</span></header>
    <main>
      <h1>Docs: reading-first reviews <span class="state">Open</span></h1>
      <p class="meta">3 markdown files changed · Press <b>Read</b> in the corner to review them as articles.</p>
      <div class="tabs"><span>Overview</span><span>Commits <b>1</b></span><span class="on">Changes <b>3</b></span></div>
      <div class="layout">
        <ul class="files" id="files"></ul>
        <section class="diff">
          <div class="file-head" id="file-head"></div>
          <table>
            <colgroup><col class="num" /><col class="num" /><col /></colgroup>
            <tbody id="diff"></tbody>
          </table>
        </section>
      </div>
    </main>
    <script src="build/demo.js"></script>
  </body>
</html>
