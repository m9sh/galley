# Weekly update pull requests for npm packages and the pinned GitHub Actions.
# Pull requests are squash-merged and their titles are checked as Conventional Commits (see
# .github/workflows/pr-title.yml), so each ecosystem gets a prefix: "build(deps): bump ...".
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      development:
        dependency-type: development
    ignore:
      # Node type definitions follow the oldest Node this extension's tooling supports ("engines"),
      # so a new major would describe APIs that are missing on the Node it must build on.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
