name: PR title

# Releases are cut from commit messages. Pull requests are squash-merged, so the title becomes the
# commit on main and has to be a Conventional Commit (see CONTRIBUTING.md).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Reads only the event payload: no checkout, no token.
permissions: {}

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # The title is untrusted input, so it goes in through the environment and never into the script.
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)(\([a-z0-9][a-z0-9._/-]*\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "Title: $TITLE"
            echo "::error title=Not a Conventional Commit::Use type(scope): summary, for example 'fix(reader): keep the scroll position'. Types: feat, fix, perf, revert, docs, style, refactor, test, build, ci, chore. Add ! after the type for a breaking change."
            exit 1
          fi
